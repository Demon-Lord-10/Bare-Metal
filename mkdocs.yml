site_name: STM32F401 Bare-Metal Firmware Notes
site_description: Study notes for developing bare-metal firmware on the STM32F401CCU6 (WeAct BlackPill)
site_author: Demon-Lord-10
repo_url: https://github.com/Demon-Lord-10/Bare-Metal

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - c
    - cpp
    - armasm
    - ld

extra_css:
  - custom.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - nl2br

nav:
  - Home: index.md
  - 1. Memory Layout & Linker Script: 01_memory_and_linker/linker_script.md
  - 2. Startup Code & Boot Sequence: 02_startup_and_boot/startup_assembly.md
  - 3. Reset & Clock Control (RCC): 03_rcc/rcc.md
  - 4. General Purpose I/O (GPIO): 04_gpio/gpio.md
