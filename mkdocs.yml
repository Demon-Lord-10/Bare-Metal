site_name: STM32F401 Bare-Metal Firmware Notes
site_description: Study notes for developing bare-metal firmware on the STM32F401CCU6 (WeAct BlackPill)
site_author: Demon-Lord-10
repo_url: https://github.com/Demon-Lord-10/Bare-Metal

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - c
    - cpp
    - armasm
    - ld

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Linker Script:
      - Memory Layout & Sections: 01_memory_and_linker/linker_script.md
  - Startup Code:
      - Reset Handler & Boot: 02_startup_and_boot/startup_assembly.md
